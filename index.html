<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Territory Fieldbook</title>
<style>
:root {
	--ui-surface: #18212b;
	--ui-surface-hi: #23303d;
	--ui-line: #2a3847;
	--ui-text: #c3cedb;
	--ui-text-strong: #f2fbfd;
	--ui-accent: #2c5f6e;
	--ui-accent-line: #4f8d9d;
	--ui-radius-sm: 3px;
	--ui-gap: 6px;
	--ui-step: 3px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
	margin: 0;
	background: #0d1117;
	color: #d7dee7;
	font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
#ui-app {
	display: flex;
	align-items: flex-start;
	gap: 14px;
	padding: 14px;
}
#ui-mapwrap {
	flex: 0 1 768px;
	min-width: 0;
	display: flex;
	flex-direction: column;
	gap: 10px;
}
#ui-canvas {
	display: block;
	width: 100%;
	height: auto;
	background: #080b0f;
	border: 1px solid #24303d;
	border-radius: 4px;
	image-rendering: pixelated;
	cursor: crosshair;
}
#ui-panel {
	flex: 0 0 340px;
	display: flex;
	flex-direction: column;
	gap: 10px;
	max-height: calc(100vh - 28px);
	overflow-y: auto;
	padding-right: 4px;
}
#ui-clock {
	font: 600 15px/1.3 ui-monospace, monospace;
	letter-spacing: 0.02em;
	color: #eef4f8;
}
.ui-row { display: flex; flex-wrap: wrap; gap: 6px; }
button.ui-chip {
	background: #18212b;
	color: #c3cedb;
	border: 1px solid #2a3847;
	border-radius: 3px;
	padding: 3px 8px;
	font: inherit;
	cursor: pointer;
}
button.ui-chip.on { background: #2c5f6e; border-color: #4f8d9d; color: #f2fbfd; }
.ui-block {
	border-top: 1px solid #1d2733;
	padding-top: 8px;
}
.ui-block h2 {
	margin: 0 0 4px;
	font-size: 10px;
	font-weight: 700;
	letter-spacing: 0.12em;
	text-transform: uppercase;
	color: #7f8fa1;
}
.ui-seg {
	display: inline-flex;
	flex-wrap: wrap;
	border: 1px solid var(--ui-line);
	border-radius: var(--ui-radius-sm);
	background: var(--ui-surface);
	overflow: hidden;
	align-self: flex-start;
}
.ui-seg-item { position: relative; display: block; }
.ui-seg-item + .ui-seg-item { border-left: 1px solid var(--ui-line); }
.ui-seg-item > span {
	display: block;
	padding: var(--ui-step) 8px;
	color: var(--ui-text);
	line-height: 1.45;
	white-space: nowrap;
	cursor: pointer;
}
.ui-seg-item > input {
	position: absolute;
	width: 1px;
	height: 1px;
	margin: 0;
	opacity: 0;
	pointer-events: none;
}
.ui-seg-item > input:checked + span { background: var(--ui-accent); color: var(--ui-text-strong); }
.ui-seg-item:hover > input:not(:checked):not(:disabled) + span { background: var(--ui-surface-hi); }
.ui-seg-item > input:focus-visible + span { outline: 2px solid var(--ui-accent-line); outline-offset: -2px; }
.ui-seg-item > input:disabled + span { opacity: 0.38; cursor: default; }
#ui-nearby {
	white-space: pre-line;
	color: #c8d2dd;
	font-size: 12px;
	max-height: 180px;
	overflow-y: auto;
}
#ui-stats, #ui-skills, #ui-members, #ui-site, #ui-inspect, #ui-victory {
	white-space: pre-line;
	color: #c8d2dd;
}
#ui-inspect { font-size: 12px; margin-top: 6px; }
#ui-engine-note { margin: 5px 0; color: #aab8c7; font-size: 12px; }
#ui-site { color: #e6edf4; }
#ui-actions { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
button.ui-act {
	text-align: left;
	background: #151d26;
	color: #d8e2ec;
	border: 1px solid #2a3847;
	border-radius: 3px;
	padding: 5px 9px;
	font: inherit;
	cursor: pointer;
}
button.ui-act.primary { background: #1d3a3f; border-color: #2f6a70; }
button.ui-act:hover:not(:disabled) { border-color: #4a6f84; }
button.ui-act:disabled { opacity: 0.38; cursor: default; }
#ui-status { min-height: 18px; color: #ffd166; }
#ui-log {
	margin: 0;
	padding: 0 0 0 16px;
	color: #93a1b1;
	font-size: 12px;
	display: flex;
	flex-direction: column;
	gap: 2px;
}
#ui-log li:first-child { color: #d5e2ee; }
@media (max-width: 1000px) {
	#ui-app { flex-direction: column; }
	#ui-mapwrap { flex: 0 0 auto; width: 100%; }
	#ui-panel { flex: 0 0 auto; width: 100%; max-width: none; max-height: none; }
}
</style>
</head>
<body>
<div id="ui-app">
	<div id="ui-mapwrap">
		<canvas id="ui-canvas"></canvas>
		<div id="ui-views" class="ui-row"></div>
		<section class="ui-block"><h2>around</h2><div id="ui-nearby"></div></section>
	</div>
	<aside id="ui-panel">
		<div id="ui-clock">day 1 · 0s · 1×</div>
		<div id="ui-time" class="ui-row"></div>
		<section class="ui-block">
			<h2>economy</h2>
			<div id="ui-engine" class="ui-row"></div>
			<p id="ui-engine-note" aria-live="polite"></p>
			<label><input id="ui-surplus" type="checkbox" checked> Stock lowers demand</label>
			<div id="ui-inspect"></div>
		</section>
		<section class="ui-block"><h2>party</h2><div id="ui-stats"></div></section>
		<section class="ui-block"><h2>skills</h2><div id="ui-skills"></div></section>
		<section class="ui-block"><h2>members</h2><div id="ui-members"></div></section>
		<section class="ui-block"><h2>here</h2><div id="ui-site"></div><div id="ui-actions"></div></section>
		<section class="ui-block"><h2>victory</h2><div id="ui-victory"></div></section>
		<div id="ui-status"></div>
		<ol id="ui-log"></ol>
	</aside>
</div>
<script src="random.js"></script>
<script src="world.js"></script>
<script src="events.js"></script>
<script src="land.js"></script>
<script src="economy.js"></script>
<script src="sites.js"></script>
<script src="map-economy.js"></script>
<script src="map-diffusion.js"></script>
<script src="map-market-flow.js"></script>
<script src="investigate.js"></script>
<script src="party.js"></script>
<script src="territory.js"></script>
<script src="rivals.js"></script>
<script src="victory.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="hud.js"></script>
<script src="hud-economy.js"></script>
<script src="actions.js"></script>
<script src="main.js"></script>
</body>
</html>
