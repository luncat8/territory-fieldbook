<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Economy Prototype</title>
<style>
	:root { color-scheme: dark; }
	body {
		margin: 0; background: #0d1117; color: #c9d1d9;
		font: 12px/1.4 system-ui, sans-serif;
		display: flex; flex-direction: column; align-items: center;
		padding: 12px;
	}
	h1 { font-size: 14px; font-weight: 600; margin: 0 0 8px; letter-spacing: .04em; }
	.wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
	.panel { display: flex; flex-direction: column; gap: 6px; }
	.label { text-transform: uppercase; font-size: 10px; letter-spacing: .1em; color: #8b949e; }
	canvas {
		width: 480px; height: 480px; image-rendering: pixelated;
		border: 1px solid #30363d; border-radius: 4px; display: block;
		cursor: crosshair;
	}
	.hud { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
	.stat { display: flex; gap: 6px; }
	.stat b { color: #58a6ff; font-variant-numeric: tabular-nums; }
	.legend { font-size: 11px; color: #8b949e; }
	.buttons { display: flex; gap: 6px; align-items: center; }
	button {
		background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
		border-radius: 4px; padding: 3px 10px; font: inherit; cursor: pointer;
	}
	button:hover { background: #30363d; }
	label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
</style>
</head>
<body>
<h1>Economy Prototype</h1>
<div class="wrap">
	<div class="panel">
		<div class="label">1 — resource storage</div>
		<canvas id="res" width="120" height="120"></canvas>
		<div class="legend">blue: low → white: high | green: source, red: consumer</div>
	</div>
	<div class="panel">
		<div class="label">2 — demand (diffusion, 0..1)</div>
		<canvas id="dem" width="120" height="120"></canvas>
		<div class="legend">red: 0 → orange: 0.5 → yellow: 1</div>
	</div>
	<div class="panel">
		<div class="label">controls</div>
		<div class="buttons">
			<span class="legend">new map demand:</span>
			<button id="fill0" data-fill="0">0</button>
			<button id="fill05" data-fill="0.5">0.5</button>
		</div>
		<div class="buttons">
			<button id="togglePause">Pause</button>
			<button id="stepOnce">Step</button>
		</div>
		<label><input type="checkbox" id="sinkDem"> resources sink demand</label>
	</div>
</div>
<div class="hud" id="hud"></div>

<script>
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const N        = 120;        // grid cells per side
const DT       = 0.05;       // sim step (s)

// demand field: diffuses from consumers, decays so hills stay local (gradient lives)
const DIFF_PASS = 20;        // Jacobi passes per step (sets how far demand spreads)
const DIFFUSE   = 0.18;      // per-pass factor (<= 0.2 stable)
const DECAY     = 0.08;      // demand decay /s (sets hill reach)

// resource transport along filtered demand gradient (mass-conserving)
const FLOW      = 18.0;      // max cells/s drift toward higher demand
const GRAD_HALF = 0.015;     // gradient magnitude for half-max speed (smooths flat noise)
const GRAD_DEAD = 1e-5;      // minimum gradient to trigger flow
const CAP       = 500;       // per-cell resource cap
const SINK      = 10.0;      // max resource/sec a starving consumer burns
const FEED_R    = 3;         // consumer eats from this radius
const EVAP      = 0.01;      // background resource decay /s

// resource sink: stock decrements demand (clamped 0..1) so resources push outward
const SINK_DEM  = 0.015;     // demand/s subtracted per resource unit

// consumers: hunger drives demand; eating lowers it (feedback)
const HUNGER    = 0.18;      // need rise /s toward 1
const DEM_RATE  = 2.5;       // demand/sec injected at full hunger
const BELLY     = 14;        // resource units to go full->empty need
const STARVE_T  = 12.0;      // sec without food before death

// sources and consumers
const SOURCES   = 5;         // constant producers
const CONSUMERS = 7;         // demand creators
const SRC_RATE  = 9.0;       // resource/sec per source

// ---------------------------------------------------------------------------
// Grid + fields (Float32Array, row-major, y*N + x)
// ---------------------------------------------------------------------------
const res     = new Float32Array(N * N);
const resNext = new Float32Array(N * N);
const demand  = new Float32Array(N * N);
const tmpDem  = new Float32Array(N * N);
const gradX   = new Float32Array(N * N);
const gradY   = new Float32Array(N * N);

const sources   = [];
const consumers = [];

let sinkEnabled = false;
let paused = false;
let hoverCell = null;

let rng = 1337;
let mapSeed = 1337;
function rand() { rng = (rng * 1664525 + 1013904223) >>> 0; return rng / 4294967296; }

// ---------------------------------------------------------------------------
// Setup
// ---------------------------------------------------------------------------
function idx(x, y) { return y * N + x; }

function init(fill = 0) {
	rng = (mapSeed = (mapSeed * 1664525 + 1013904223) >>> 0);
	res.fill(0); resNext.fill(0); demand.fill(fill); tmpDem.fill(0);
	gradX.fill(0); gradY.fill(0);
	sources.length = 0; consumers.length = 0;

	for (let i = 0; i < SOURCES; i++) {
		sources.push({
			x: 15 + Math.floor(rand() * (N - 30)),
			y: 15 + Math.floor(rand() * (N - 30)),
			r: 6 + Math.floor(rand() * 5),
		});
	}
	for (let i = 0; i < CONSUMERS; i++) {
		consumers.push({
			x: 15 + Math.floor(rand() * (N - 30)),
			y: 15 + Math.floor(rand() * (N - 30)),
			alive: true,
			need: 0.5,      // 0 fed .. 1 starving
			starve: 0,
		});
	}

	// seed a little resource around sources so the field is visible on frame 1
	for (const s of sources) {
		for (let dy = -s.r; dy <= s.r; dy++) {
			for (let dx = -s.r; dx <= s.r; dx++) {
				const d = Math.hypot(dx, dy);
				if (d <= s.r) {
					const x = s.x + dx, y = s.y + dy;
					if (x >= 0 && x < N && y >= 0 && y < N) {
						res[idx(x, y)] = 8 * (1 - d / s.r);
					}
				}
			}
		}
	}
}

// ---------------------------------------------------------------------------
// Demand: consumers inject by hunger, field diffuses + decays, then Sobel gradient
// ---------------------------------------------------------------------------
function stepDemand() {
	// 1. each consumer injects demand scaled by how hungry it is
	for (const c of consumers) {
		if (!c.alive) continue;
		const i = idx(c.x, c.y);
		demand[i] = Math.min(1, demand[i] + c.need * DEM_RATE * DT);
	}

	// 2. diffusion — Jacobi passes spread each consumer's demand into a hill
	for (let p = 0; p < DIFF_PASS; p++) {
		tmpDem.set(demand);
		for (let y = 1; y < N - 1; y++) {
			const row = y * N;
			for (let x = 1; x < N - 1; x++) {
				const i = row + x;
				const lap = tmpDem[i - 1] + tmpDem[i + 1] + tmpDem[i - N] + tmpDem[i + N]
				            - 4 * tmpDem[i];
				demand[i] = tmpDem[i] + DIFFUSE * lap;
			}
		}
	}

	// 3. decay: hills fade with distance so a gradient survives
	const r = 1 - DECAY * DT;
	for (let i = 0; i < demand.length; i++) {
		let d = demand[i] * r;
		// 3b. resource sink: stock decrements demand (clamped 0..1)
		if (sinkEnabled && res[i] > 0) {
			d -= res[i] * SINK_DEM * DT;
		}
		if (d < 0) d = 0; else if (d > 1) d = 1;
		demand[i] = d;
	}

	// 4. Sobel 3x3 filtered gradient of demand (reduces grid-axis artifacts)
	for (let y = 1; y < N - 1; y++) {
		const row = y * N;
		for (let x = 1; x < N - 1; x++) {
			const i = row + x;
			const gx =
				(demand[i - N + 1] + 2 * demand[i + 1] + demand[i + N + 1]) -
				(demand[i - N - 1] + 2 * demand[i - 1] + demand[i + N - 1]);
			const gy =
				(demand[i + N - 1] + 2 * demand[i + N] + demand[i + N + 1]) -
				(demand[i - N - 1] + 2 * demand[i - N] + demand[i - N + 1]);
			gradX[i] = gx * 0.125;
			gradY[i] = gy * 0.125;
		}
	}
}

// ---------------------------------------------------------------------------
// Resources: source injection, mass-conserving gradient advection, demand-proportional sink
// ---------------------------------------------------------------------------
function stepResources() {
	// 1. constant sources produce
	for (const s of sources) {
		for (let dy = -s.r; dy <= s.r; dy++) {
			const y = s.y + dy;
			if (y < 0 || y >= N) continue;
			for (let dx = -s.r; dx <= s.r; dx++) {
				const x = s.x + dx;
				if (x < 0 || x >= N) continue;
				const d = Math.sqrt(dx * dx + dy * dy);
				if (d > s.r) continue;
				const fall = 1 - d / s.r;
				res[idx(x, y)] += SRC_RATE * DT * fall;
			}
		}
	}

	// 2. mass-conserving forward advection along filtered demand gradient.
	//    Speed scales smoothly with gradient magnitude (no noise-amplification).
	//    Each cell's mass is bilinearly deposited at (x + vx*dt, y + vy*dt).
	resNext.fill(0);
	const maxStep = Math.min(0.95, FLOW * DT);
	for (let y = 0; y < N; y++) {
		const row = y * N;
		for (let x = 0; x < N; x++) {
			const i = row + x;
			const mass = res[i];
			if (mass <= 1e-7) continue;

			const gx = gradX[i], gy = gradY[i];
			const mag = Math.hypot(gx, gy);
			if (mag < GRAD_DEAD) {
				resNext[i] += mass;
				continue;
			}

			// magnitude-aware speed: 0 at flat, saturates toward maxStep on steep hills
			const speed = maxStep * (mag / (mag + GRAD_HALF));
			let tx = x + (gx / mag) * speed;
			let ty = y + (gy / mag) * speed;

			if (tx < 0) tx = 0; else if (tx > N - 1.0001) tx = N - 1.0001;
			if (ty < 0) ty = 0; else if (ty > N - 1.0001) ty = N - 1.0001;

			const x0 = tx | 0, y0 = ty | 0;
			const fx = tx - x0, fy = ty - y0;
			const x1 = x0 + 1 < N ? x0 + 1 : x0;
			const y1 = y0 + 1 < N ? y0 + 1 : y0;

			resNext[idx(x0, y0)] += mass * (1 - fx) * (1 - fy);
			resNext[idx(x1, y0)] += mass * fx * (1 - fy);
			resNext[idx(x0, y1)] += mass * (1 - fx) * fy;
			resNext[idx(x1, y1)] += mass * fx * fy;
		}
	}
	res.set(resNext);

	// 3. consumers sink resources at speed proportional to local demand & hunger
	//    so fed settlements don't act as black holes and excess can flow past
	for (const c of consumers) {
		if (!c.alive) continue;
		const localDem = Math.max(0.05, demand[idx(c.x, c.y)]);
		const want = SINK * c.need * localDem * DT;
		let got = 0;
		for (let dy = -FEED_R; dy <= FEED_R && got < want; dy++) {
			const y = c.y + dy;
			if (y < 0 || y >= N) continue;
			for (let dx = -FEED_R; dx <= FEED_R; dx++) {
				const x = c.x + dx;
				if (x < 0 || x >= N) continue;
				const i = idx(x, y);
				const take = Math.min(res[i], want - got);
				res[i] -= take;
				got += take;
				if (got >= want) break;
			}
		}
		c.need -= (got / BELLY);
		if (c.need < 0) c.need = 0;
		if (c.need > 0.8 && got < want * 0.1) c.starve += DT;
		else c.starve = Math.max(0, c.starve - DT * 0.5);
		if (c.starve > STARVE_T) { c.alive = false; c.need = 0; }
	}

	// 4. hunger climbs back over time
	for (const c of consumers) {
		if (!c.alive) continue;
		c.need = Math.min(1, c.need + HUNGER * DT);
	}

	// 5. background decay + clamp
	const evap = 1 - EVAP * DT;
	for (let i = 0; i < res.length; i++) {
		let v = res[i] * evap;
		if (v < 0) v = 0; else if (v > CAP) v = CAP;
		res[i] = v;
	}
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
const resCanvas = document.getElementById('res');
const demCanvas = document.getElementById('dem');
const resCtx = resCanvas.getContext('2d');
const demCtx = demCanvas.getContext('2d');
const resImg = resCtx.createImageData(N, N);
const demImg = demCtx.createImageData(N, N);

let resScale = 80;

function resColor(v) {
	const t = Math.min(1, v / resScale);
	const r = (25 + 230 * t) | 0;
	const g = (75 + 180 * t) | 0;
	const b = (190 + 65 * t) | 0;
	return [r, g, b];
}

function demColor(v) {
	// 0..1: dark red -> orange -> bright yellow
	const t = v < 0 ? 0 : (v > 1 ? 1 : v);
	const r = (140 + 115 * t) | 0;
	const g = (25 + 215 * t) | 0;
	const b = (25 + 45 * t) | 0;
	return [r, g, b];
}

function easeScale(cur, peak, rate) {
	const target = peak > 1e-3 ? peak : cur;
	return cur + (target - cur) * rate;
}

function render() {
	let resPeak = 0;
	const rd = resImg.data;
	for (let i = 0; i < res.length; i++) {
		if (res[i] > resPeak) resPeak = res[i];
	}
	resScale = easeScale(resScale, resPeak * 0.9, 0.05);
	for (let i = 0, p = 0; i < res.length; i++, p += 4) {
		const c = resColor(res[i]);
		rd[p] = c[0]; rd[p + 1] = c[1]; rd[p + 2] = c[2]; rd[p + 3] = 255;
	}
	resCtx.putImageData(resImg, 0, 0);

	const dd = demImg.data;
	for (let i = 0, p = 0; i < demand.length; i++, p += 4) {
		const c = demColor(demand[i]);
		dd[p] = c[0]; dd[p + 1] = c[1]; dd[p + 2] = c[2]; dd[p + 3] = 255;
	}
	demCtx.putImageData(demImg, 0, 0);

	// overlay markers in grid space (canvas is N x N, CSS-scaled to 480x480)
	drawMarkers(resCtx, sources, '#3fb950', 1.5);
	drawMarkers(resCtx, consumers, '#f85149', 1.3);
	drawMarkers(demCtx, consumers, '#f85149', 1.3);

	updateHud();
}

function drawMarkers(ctx, list, color, radius) {
	ctx.fillStyle = color;
	for (const m of list) {
		if (m.alive === false) continue;
		ctx.beginPath();
		ctx.arc(m.x + 0.5, m.y + 0.5, radius, 0, 7);
		ctx.fill();
	}
}

// ---------------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------------
const hud = document.getElementById('hud');
let fps = 0, frames = 0, fpsClock = 0;

function updateHud() {
	let totalRes = 0, totalDem = 0, aliveCons = 0;
	for (let i = 0; i < res.length; i++) { totalRes += res[i]; totalDem += demand[i]; }
	for (const c of consumers) if (c.alive) aliveCons++;

	let html =
		stat('res', totalRes.toFixed(0)) +
		stat('dem', totalDem.toFixed(1)) +
		stat('alive', aliveCons + '/' + consumers.length) +
		stat('fps', fps);

	if (hoverCell) {
		const i = idx(hoverCell.x, hoverCell.y);
		const g = Math.hypot(gradX[i], gradY[i]);
		html += stat('cell', `${hoverCell.x},${hoverCell.y}`) +
		        stat('r', res[i].toFixed(2)) +
		        stat('d', demand[i].toFixed(3)) +
		        stat('|∇d|', g.toFixed(4));
	}
	hud.innerHTML = html;
}

function stat(label, val) {
	return `<div class="stat">${label} <b>${val}</b></div>`;
}

// ---------------------------------------------------------------------------
// Main loop (fixed step)
// ---------------------------------------------------------------------------
let last = performance.now();
let acc = 0;

function frame(now) {
	const elapsed = Math.min(0.25, (now - last) / 1000);
	last = now;

	frames++;
	fpsClock += elapsed;
	if (fpsClock >= 0.5) { fps = Math.round(frames / fpsClock); frames = 0; fpsClock = 0; }

	if (!paused) {
		acc += elapsed;
		while (acc >= DT) {
			stepDemand();
			stepResources();
			acc -= DT;
		}
	}

	render();
	requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------
// Controls & Boot
// ---------------------------------------------------------------------------
document.querySelectorAll('[data-fill]').forEach(btn => {
	btn.addEventListener('click', () => {
		init(parseFloat(btn.dataset.fill));
	});
});

document.getElementById('sinkDem').addEventListener('change', e => {
	sinkEnabled = e.target.checked;
});

const pauseBtn = document.getElementById('togglePause');
pauseBtn.addEventListener('click', () => {
	paused = !paused;
	pauseBtn.textContent = paused ? 'Play' : 'Pause';
});

document.getElementById('stepOnce').addEventListener('click', () => {
	if (!paused) { paused = true; pauseBtn.textContent = 'Play'; }
	stepDemand();
	stepResources();
});

[resCanvas, demCanvas].forEach(c => {
	c.addEventListener('mousemove', e => {
		const rect = c.getBoundingClientRect();
		const x = Math.floor(((e.clientX - rect.left) / rect.width) * N);
		const y = Math.floor(((e.clientY - rect.top) / rect.height) * N);
		if (x >= 0 && x < N && y >= 0 && y < N) hoverCell = { x, y };
	});
	c.addEventListener('mouseleave', () => { hoverCell = null; });
});

init(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
